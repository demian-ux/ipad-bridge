<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>iPad Bridge</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
 html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
 #c,#s{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
 #s{background:transparent}
 #pad{position:fixed;inset:0;touch-action:none}
 #msg{position:fixed;left:0;right:0;top:40%;text-align:center;color:#999;font:20px system-ui;pointer-events:none}
 #hud{position:fixed;top:8px;right:12px;color:#6f6;font:12px ui-monospace,monospace;opacity:.7;pointer-events:auto;touch-action:none;
      padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;z-index:6}
 #hud b{color:#ff6;font-weight:600}
 /* Barra de teclas (estilo ExpressKeys): tira vertical en un borde, encima del área de dibujo */
 #bar{position:fixed;top:50%;left:6px;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:4px;
      background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:14px;touch-action:none;z-index:5}
 #bar.right,#tab.right{left:auto;right:6px}
 #bar button{width:44px;height:44px;margin:0;padding:0;border:0;border-radius:9px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);
      font:600 17px/1 system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;-webkit-tap-highlight-color:transparent}
 #bar button small{font-size:8px;font-weight:500;opacity:.7;white-space:nowrap}
 #bar button.pressed{opacity:.5;transform:scale(.94)}
 #bar button.on{background:rgba(255,220,0,.9);color:#000}
 #bar .grip{height:24px;background:transparent;color:rgba(255,255,255,.5);font-size:13px}
 #bar hr{width:32px;border:0;border-top:1px solid rgba(255,255,255,.15);margin:1px auto}
 #tab{position:fixed;top:50%;left:6px;transform:translateY(-50%);width:18px;height:56px;padding:0;border:0;border-radius:9px;
      background:rgba(0,0,0,.4);color:rgba(255,255,255,.6);font:700 14px system-ui;touch-action:none;z-index:5;-webkit-tap-highlight-color:transparent}
</style></head><body>
<canvas id="c"></canvas>
<canvas id="s" hidden></canvas>
<div id="pad"></div>
<div id="msg">Conectando con la PC…</div>
<div id="hud"></div>
<div id="bar">
 <button class="grip" data-grip title="toque largo: cambiar de lado">≡</button>
 <button data-mod="shift">⇧<small>shift</small></button>
 <button data-mod="ctrl">⌃<small>ctrl</small></button>
 <button data-mod="alt">⌥<small>alt</small></button>
 <button data-mod="space">␣<small>esp</small></button>
 <hr>
 <button data-key="ctrl+z">↶<small>deshacer</small></button>
 <button data-key="ctrl+shift+z">↷<small>rehacer</small></button>
 <button data-key="[">[<small>pincel −</small></button>
 <button data-key="]">]<small>pincel +</small></button>
 <button data-key="b">B<small>pincel</small></button>
 <button data-key="e">E<small>goma</small></button>
 <hr>
 <button data-hide>✕<small>ocultar</small></button>
</div>
<button id="tab" hidden>›</button>
<script>
const c=document.getElementById('c'), ctx=c.getContext('2d',{alpha:false,desynchronized:true});
const pad=document.getElementById('pad'), msg=document.getElementById('msg'), hud=document.getElementById('hud');
let ws, vw=0, vh=0, decoder=null, waitingKey=true, dec={frames:0,t:performance.now()}, penHud='';

// ---- Medición (ítem 0.1 del plan). Reloj sincronizado con el servidor estilo NTP: ping cada 2 s con nuestro reloj,
// ---- el servidor responde pong con el mismo t y su reloj mt; offset = mt - (t + rtt/2), tomado de la muestra de menor
// ---- RTT de las últimas 15. Cada frame trae ts (reloj del servidor al salir del encoder): e2e = ahora - ts. ----
const clock={samples:[],offset:null,rtt:null,inp50:null,inp95:null,srv:{}};
const serverNow=()=>performance.now()+clock.offset;
let pingTimer=0, statsTimer=0;
const meas={e2e:[],pres:[],presented:0,drops:0,dropsSincePing:0,bytes:0,lastTs:0};
function sendPing(){
  if(!ws||ws.readyState!==1)return;
  ws.send(JSON.stringify({type:'ping',t:performance.now(),q:decoder?decoder.decodeQueueSize:0,d:meas.dropsSincePing,rtt:clock.rtt}));
  meas.dropsSincePing=0;
}
function onPong(m){
  const now=performance.now(), rtt=now-m.t;
  if(!(rtt>=0&&rtt<2000))return;               // RTT inválido: descartar
  clock.samples.push({rtt:rtt,offset:m.mt-(m.t+rtt/2)});
  if(clock.samples.length>15)clock.samples.shift();
  const best=clock.samples.reduce((a,b)=>b.rtt<a.rtt?b:a);
  clock.offset=best.offset;clock.rtt=rtt;clock.inp50=m.inp50;clock.inp95=m.inp95;clock.srv=m;
}
// Preset de calidad (ítem 1.7): auto / dibujo (nitidez: nunca baja la escala) / movimiento (fps: nunca baja los fps).
// Se cambia tocando el HUD; se recuerda y se manda al conectar.
const MODES=[['auto','auto'],['draw','dibujo'],['motion','movimiento']];
let qmode='auto';try{qmode=localStorage.qualityMode||'auto';}catch(e){}
function sendQuality(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'quality',mode:qmode}));}
hud.addEventListener('pointerdown',function(e){
  e.preventDefault();e.stopPropagation();
  const i=MODES.findIndex(m=>m[0]===qmode);qmode=MODES[(i+1)%MODES.length][0];
  try{localStorage.qualityMode=qmode;}catch(err){}
  sendQuality();updateHud();
});

function connectWS(){
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{ws.send(JSON.stringify({type:'hello',role:'ipad'}));msg.textContent='Esperando que la PC comparta pantalla…';
    sendQuality();
    clock.samples=[];clock.offset=null;sendPing();clearInterval(pingTimer);pingTimer=setInterval(sendPing,2000);
    clearInterval(statsTimer);statsTimer=setInterval(sendStats,5000);};
  ws.onclose=()=>{msg.textContent='Sin conexión con la PC, reintentando…';clearInterval(pingTimer);clearInterval(statsTimer);setTimeout(connectWS,1500);};
  ws.onmessage=async e=>{
    if(e.data instanceof ArrayBuffer){
      if(new Uint8Array(e.data,0,1)[0]===2)showStill(e.data.slice(1));else onVideoChunk(e.data);
      return;}
    const m=JSON.parse(e.data);
    if(m.type==='vconfig')await setupDecoder(m);
    if(m.type==='still-clear'){stillSeq++;sc.hidden=true;}
    if(m.type==='pong')onPong(m);
  };
}

// ---- Imagen fija sin pérdida (PNG) cuando la pantalla está quieta ----
const sc=document.getElementById('s'), sctx=sc.getContext('2d');
let stillSeq=0;
async function showStill(buf){
  const seq=++stillSeq;
  try{
    const bmp=await createImageBitmap(new Blob([buf],{type:'image/png'}));
    if(seq!==stillSeq){bmp.close();return;}   // llegó un still-clear mientras decodificaba
    if(sc.width!==bmp.width||sc.height!==bmp.height){sc.width=bmp.width;sc.height=bmp.height;}
    sctx.drawImage(bmp,0,0);bmp.close();sc.hidden=false;
  }catch(e){}
}

// ---- Video: HEVC 10 bits por WebSocket, decode por hardware, sin buffer de jitter ----
function b64dec(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function setupDecoder(m){
  if(!('VideoDecoder' in window)){
    msg.innerHTML=location.protocol==='http:'
      ?'Esta página necesita https.<br>Abrí <a style="color:#6af" href="http://'+location.hostname+'/">la guía de instalación</a>.'
      :'Este Safari no tiene WebCodecs (necesita iPadOS 16.4 o más nuevo).';
    msg.style.pointerEvents='auto';return;}
  if(decoder){try{decoder.close();}catch(e){}}
  const cfg={codec:m.codec,optimizeForLatency:true};
  if(m.description)cfg.description=b64dec(m.description);
  // Mientras se configura, los chunks que llegan (el IDR viene pegado al vconfig) se guardan en vez de perderse.
  configuring=true;pending=[];
  const sup=await VideoDecoder.isConfigSupported(cfg);
  if(!sup.supported){msg.textContent='Safari no decodifica '+m.codec;configuring=false;return;}
  vw=m.width;vh=m.height;c.width=vw;c.height=vh;
  decoder=new VideoDecoder({
    output:frame=>{
      ctx.drawImage(frame,0,0,c.width,c.height);const ts=frame.timestamp/1000;frame.close();dec.frames++;msg.textContent='';
      if(clock.offset!==null){meas.e2e.push(serverNow()-ts);meas.lastTs=ts;}
      // Presentación: el canvas se pinta en el próximo refresco; rAF corre justo antes, así que mide casi al vidrio.
      if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;meas.presented++;if(clock.offset!==null&&meas.lastTs)meas.pres.push(serverNow()-meas.lastTs);});}
    },
    error:e=>{msg.textContent='decoder: '+e.message;needKey();}
  });
  decoder.configure(cfg);
  configuring=false;waitingKey=true;
  const q=pending;pending=[];
  for(const b of q)onVideoChunk(b);
  if(waitingKey)needKey();   // el IDR no venía con el vconfig (nos sumamos a una captura en marcha): pedirlo
}
let configuring=false, pending=[], rafPending=false, keyAsk=0;
// Pedir keyframe. Con intra-refresh el servidor reinicia el encoder; si no llega en 1,5 s (se ignoró por reciente), insistir.
function needKey(){
  waitingKey=true;if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'need-key'}));
  clearTimeout(keyAsk);keyAsk=setTimeout(()=>{if(waitingKey)needKey();},1500);
}
function onVideoChunk(buf){
  if(configuring){pending.push(buf);if(pending.length>120)pending.shift();return;}
  if(!decoder||decoder.state!=='configured')return;
  const dv=new DataView(buf);const key=dv.getUint8(0)===1, ts=dv.getFloat64(1);   // ts: reloj del servidor en ms
  meas.bytes+=buf.byteLength-9;
  if(waitingKey){if(!key){meas.drops++;meas.dropsSincePing++;return;}waitingKey=false;clearTimeout(keyAsk);}
  if(decoder.decodeQueueSize>6){meas.drops++;meas.dropsSincePing++;needKey();return;}
  try{decoder.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:Math.round(ts*1000),data:new Uint8Array(buf,9)}));}
  catch(e){meas.drops++;meas.dropsSincePing++;needKey();}
}
// ---- HUD: fps decodificados (presentados) · e2e captura->pantalla p50/p95 (al decodificar / al presentar) · input ·
// ---- rtt · cola · descartes · Mbps · lo que manda el servidor (escala, bitrate, modo). Tocar el HUD cambia el modo. ----
const p=(a,q)=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(s.length*q))];};
const f=v=>v===null||v===undefined?'–':Math.round(v);
let last={fps:0,pfps:0,mbps:0,e2e:[],pres:[]};
function updateHud(){
  const modeName=(MODES.find(m=>m[0]===qmode)||MODES[0])[1], s=clock.srv;
  const srv=s.scale?Math.round(s.scale*100)+'%/'+s.br+'M'+(s.level?' n'+s.level:''):'';
  if(!decoder){hud.innerHTML='<b>'+modeName+'</b>';return;}
  hud.innerHTML=last.fps+' fps ('+last.pfps+' pres) · e2e '+f(p(last.e2e,.5))+'/'+f(p(last.e2e,.95))+' pres '+f(p(last.pres,.5))+'/'+f(p(last.pres,.95))
    +' · in '+f(clock.inp50)+'/'+f(clock.inp95)+' · rtt '+f(clock.rtt)+' · cola '+decoder.decodeQueueSize+' · desc '+meas.drops
    +' · '+last.mbps.toFixed(1)+' Mbps · '+srv+' <b>'+modeName+'</b>'+(penHud?' · '+penHud:'');
}
setInterval(()=>{
  const dt=(performance.now()-dec.t)/1000;
  last={fps:Math.round(dec.frames/dt),pfps:Math.round(meas.presented/dt),mbps:meas.bytes*8/dt/1e6,e2e:meas.e2e,pres:meas.pres};
  updateHud();
  dec={frames:0,t:performance.now()};meas.presented=0;meas.bytes=0;
  // Ventana de 5 s para los percentiles: al vaciarse de a poco los últimos segundos pesan más.
  if(meas.e2e.length>300)meas.e2e=meas.e2e.slice(-300);if(meas.pres.length>300)meas.pres=meas.pres.slice(-300);
},1000);
// stats al servidor cada 5 s (quedan en su log y en pc.html): fps, Mbps, e2e, cola, descartes, transporte.
function sendStats(){
  if(!ws||ws.readyState!==1||!decoder)return;
  const n=v=>v===null||v===undefined?null:Math.round(v);
  ws.send(JSON.stringify({type:'stats',fps:last.fps,pfps:last.pfps,mbps:+last.mbps.toFixed(1),e2e50:n(p(meas.e2e,.5)),e2e95:n(p(meas.e2e,.95)),
    pres50:n(p(meas.pres,.5)),pres95:n(p(meas.pres,.95)),rtt:n(clock.rtt),q:decoder.decodeQueueSize,drops:meas.drops,transport:location.protocol==='https:'?'wss':'ws',mode:qmode}));
}

// ---- Input: Pencil = lápiz de Windows con presión, inclinación y hover. Un dedo = mover cursor (tap = click).
// ---- Dos dedos = scroll. Mientras el Pencil toca, los dedos se ignoran (palma). ----
function norm(cx,cy){
  const W=innerWidth,H=innerHeight;
  if(!vw||!vh)return [cx/W,cy/H];
  const s=Math.min(W/vw,H/vh), dw=vw*s, dh=vh*s, ox=(W-dw)/2, oy=(H-dh)/2;
  return [Math.min(1,Math.max(0,(cx-ox)/dw)), Math.min(1,Math.max(0,(cy-oy)/dh))];
}
// Cada evento lleva t = reloj del servidor estimado (medición de latencia de input), cuando ya hay reloj sincronizado.
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(Object.assign({type:'input'},o,clock.offset!==null?{t:serverNow()}:{})));};
let pendingMove=null, raf=0, touches=new Map(), lastScrollY=null, lastScrollX=null, tapStart=null, penDown=false;
function flush(){raf=0;if(pendingMove){send(pendingMove);pendingMove=null;}}
function queueMove(x,y){pendingMove={ev:'move',x:x,y:y};if(!raf)raf=requestAnimationFrame(flush);}
const tilt=e=>[Math.round(e.tiltX||0),Math.round(e.tiltY||0)];

pad.addEventListener('pointerdown',function(e){
  pad.setPointerCapture(e.pointerId);
  const n=norm(e.clientX,e.clientY), x=n[0], y=n[1];
  if(e.pointerType==='pen'){
    const t=tilt(e);penDown=true;
    send({ev:'down',pen:1,x:x,y:y,p:e.pressure,tx:t[0],ty:t[1],btn:(e.buttons&2)?2:0});penHud='pen '+e.pressure.toFixed(2);return;}
  if(penDown)return;                       // palma o dedo mientras se dibuja
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===1){tapStart={t:performance.now(),x:e.clientX,y:e.clientY};queueMove(x,y);}
  if(touches.size===2){lastScrollY=null;tapStart=null;}
});
pad.addEventListener('pointermove',function(e){
  const n=norm(e.clientX,e.clientY), x=n[0], y=n[1];
  if(e.pointerType==='pen'){
    if(e.buttons&1){
      // Trayectoria completa: todos los eventos coalescidos del frame, no solo el último.
      const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
      const pts=(evs.length?evs:[e]).map(c=>{const m=norm(c.clientX,c.clientY),t=tilt(c);return [m[0],m[1],c.pressure,t[0],t[1]];});
      send({ev:'moves',pen:1,pts:pts});penHud='pen '+e.pressure.toFixed(2);
    }else{const t=tilt(e);send({ev:'hover',pen:1,x:x,y:y,tx:t[0],ty:t[1]});penHud='hover';}
    return;}
  if(!touches.has(e.pointerId))return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===1){queueMove(x,y);}
  else if(touches.size===2){
    const pts=Array.from(touches.values());const cy=(pts[0].y+pts[1].y)/2, cx=(pts[0].x+pts[1].x)/2;
    if(lastScrollY!==null){const dy=cy-lastScrollY, dx=cx-lastScrollX;if(Math.abs(dy)>2||Math.abs(dx)>2)send({ev:'scroll',dy:Math.round(dy*3),dx:Math.round(-dx*3)});}
    lastScrollY=cy;lastScrollX=cx;
  }
});
function endPointer(e){
  const n=norm(e.clientX,e.clientY), x=n[0], y=n[1];
  if(e.pointerType==='pen'){penDown=false;send({ev:'up',pen:1,x:x,y:y});penHud='';return;}
  touches.delete(e.pointerId);
  if(tapStart&&touches.size===0){
    const dt=performance.now()-tapStart.t, d=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y);
    if(dt<250&&d<12){flush();send({ev:'down',x:x,y:y,btn:0});send({ev:'up',x:x,y:y,btn:0});}
    tapStart=null;
  }
  if(touches.size<2)lastScrollY=null;
}
pad.addEventListener('pointerup',endPointer);pad.addEventListener('pointercancel',endPointer);
// El Pencil se alejó de la pantalla (o terminó el trazo en iPads sin hover): Windows vuelve al cursor normal.
pad.addEventListener('pointerleave',function(e){if(e.pointerType==='pen'&&!penDown){send({ev:'leave',pen:1});penHud='';}});
pad.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});

// ---- Barra de teclas (estilo ExpressKeys). Está encima de #pad, así que sus toques no llegan a la lógica de
// ---- dedos/palma: un dedo mantiene Shift/Ctrl/Alt/Espacio mientras el Pencil dibuja. Los modificadores mandan
// ---- {ev:'mod',key,down:true} al apoyar y down:false al soltar; las pulsaciones {ev:'key',keys:'ctrl+z'} al apoyar. ----
const bar=document.getElementById('bar'), tab=document.getElementById('tab');
const held=new Map();   // pointerId -> modificador mantenido (se pueden mantener dos a la vez)
let gripTimer=0;
function setSide(r){bar.classList.toggle('right',r);tab.classList.toggle('right',r);tab.textContent=r?'‹':'›';try{localStorage.keyBarRight=r?'1':'';}catch(e){}}
try{setSide(!!localStorage.keyBarRight);}catch(e){}
function releaseHeld(){held.forEach(mod=>send({ev:'mod',key:mod,down:false}));held.clear();bar.querySelectorAll('.on,.pressed').forEach(b=>b.classList.remove('on','pressed'));}
bar.addEventListener('pointerdown',function(e){
  const b=e.target.closest('button');if(!b)return;
  e.preventDefault();e.stopPropagation();try{b.setPointerCapture(e.pointerId);}catch(err){}b.classList.add('pressed');
  if(b.dataset.mod!==undefined){held.set(e.pointerId,b.dataset.mod);b.classList.add('on');send({ev:'mod',key:b.dataset.mod,down:true});}
  else if(b.dataset.key!==undefined)send({ev:'key',keys:b.dataset.key});
  else if(b.dataset.grip!==undefined)gripTimer=setTimeout(function(){gripTimer=0;setSide(!bar.classList.contains('right'));},500);
  else if(b.dataset.hide!==undefined){releaseHeld();bar.hidden=true;tab.hidden=false;}
});
function barUp(e){
  const b=e.target.closest('button');if(b)b.classList.remove('pressed');
  if(gripTimer){clearTimeout(gripTimer);gripTimer=0;}
  const mod=held.get(e.pointerId);
  if(mod!==undefined){held.delete(e.pointerId);if(b)b.classList.remove('on');send({ev:'mod',key:mod,down:false});}
}
bar.addEventListener('pointerup',barUp);bar.addEventListener('pointercancel',barUp);
bar.addEventListener('contextmenu',function(e){e.preventDefault();});
tab.addEventListener('pointerdown',function(e){e.preventDefault();bar.hidden=false;tab.hidden=true;});
window.addEventListener('blur',releaseHeld);   // al salir de Safari no dejar un modificador pegado
connectWS();
</script></body></html>
